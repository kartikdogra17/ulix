[build]
  command = "npm run build"
  publish = "dist"

# Routing is hash-based, so this only catches stray direct hits.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The worker must never be served stale, or an old shell pins itself.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
